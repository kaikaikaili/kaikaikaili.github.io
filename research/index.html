        <p>我的研究位于<strong>大气科学</strong>、<strong>雷达气象学</strong>与<strong>深度学习</strong>的交汇处：
利用深度学习算法解析复杂的云物理过程与降水垂直结构，尤其关注台风等极端天气系统中的定量反演问题。</p>
<div class="mission" style="margin: 18px 0; padding: 16px 20px; background: #eef4f9; border-left: 4px solid #1c5d99; border-radius: 8px;">
<p style="margin: 0;"><strong>在研课题 · 青年学生基础研究项目</strong><br>
深度学习驱动的星载双频雷达台风降水垂直速度定量反演研究 —— 基于 GPM-DPR 双频雷达观测，探索深度学习在降水粒子垂直速度反演中的应用。</p>
