<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta http-equiv="X-XSS-Protection" content="1; mode=block">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin">
    <meta http-equiv="Permissions-Policy" content="geolocation=(), microphone=(), camera=()">
    <meta content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data:; font-src https://cdnjs.cloudflare.com; connect-src 'self';" http-equiv="Content-Security-Policy">
    <title>学术日志 - 李凯</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha512-iecdLmaskl7CVkqkXNQ/ZH/XLlvWZOJyj7Yy7tcenmpD1ypASozpmT/E0iPtmFIB46ZmdtAc9eNBvH0H/ZpiBw==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="../css/theme.css">
    <style>
        /* 页面头部 */
        .page-header {
            text-align: center;
            margin-bottom: 48px;
            padding: 40px 0 20px;
        }
        
        .page-icon {
            width: 70px;
            height: 70px;
            margin: 0 auto 16px;
            border-radius: 50%;
            background: linear-gradient(135deg, #10b981, #059669);
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 1.8rem;
            box-shadow: 0 8px 24px rgba(16, 185, 129, 0.3);
        }
        
        .page-title {
            font-size: 2.2rem;
            font-weight: 700;
            background: linear-gradient(135deg, #10b981, #0d9488);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 8px;
        }
        
        .page-subtitle {
            color: var(--text-muted);
            font-size: 1rem;
        }
        
        /* 博客列表 */
        .blog-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        
        .blog-item {
            display: flex;
            gap: 24px;
            padding: 28px;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow-sm);
            transition: all var(--transition-normal);
            text-decoration: none;
            color: var(--text-primary);
            position: relative;
            overflow: hidden;
        }
        
        .blog-item::before {
            content: '';
            position: absolute;
            left: 0;
            top: 0;
            bottom: 0;
            width: 4px;
            background: linear-gradient(to bottom, #10b981, #0ea5e9);
            transform: scaleY(0);
            transform-origin: top;
            transition: transform var(--transition-normal);
        }
        
        .blog-item:hover {
            transform: translateX(4px);
            box-shadow: var(--shadow-lg);
            border-color: rgba(16, 185, 129, 0.3);
        }
        
        .blog-item:hover::before {
            transform: scaleY(1);
        }
        
        .blog-date-col {
            flex-shrink: 0;
            text-align: center;
            padding-right: 24px;
            border-right: 2px solid var(--bg-tertiary);
            min-width: 100px;
        }
        
        .blog-date-day {
            font-size: 2rem;
            font-weight: 700;
            color: var(--primary);
            line-height: 1;
        }
        
        .blog-date-month {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 4px;
            font-weight: 500;
        }
        
        .blog-content {
            flex: 1;
            min-width: 0;
        }
        
        .blog-title {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 10px;
            line-height: 1.5;
            transition: color var(--transition-fast);
        }
        
        .blog-item:hover .blog-title {
            color: var(--accent-dark);
        }
        
        .blog-excerpt {
            font-size: 0.95rem;
            color: var(--text-secondary);
            line-height: 1.7;
            margin-bottom: 16px;
        }
        
        .blog-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .blog-tag {
            padding: 4px 12px;
            font-size: 0.8rem;
            border-radius: 6px;
            font-weight: 500;
        }
        
        .blog-tag.research {
            background: rgba(59, 130, 246, 0.1);
            color: #2563eb;
        }
        
        .blog-tag.dl {
            background: rgba(139, 92, 246, 0.1);
            color: #7c3aed;
        }
        
        .blog-tag.life {
            background: rgba(245, 158, 11, 0.1);
            color: #d97706;
        }
        
        .blog-tag.run {
            background: rgba(239, 68, 68, 0.1);
            color: #dc2626;
        }
        
        /* 结尾注释 */
        .end-note {
            text-align: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 40px;
            padding: 20px;
            font-style: italic;
            position: relative;
        }
        
        .end-note::before,
        .end-note::after {
            content: '';
            position: absolute;
            top: 50%;
            width: 60px;
            height: 1px;
            background: var(--border-color);
        }
        
        .end-note::before {
            left: calc(50% - 100px);
        }
        
        .end-note::after {
            right: calc(50% - 100px);
        }
        
        /* 入场动画 */
        .page-header { animation: fadeInUp 0.6s ease both; }
        .blog-item:nth-child(1) { animation: fadeInUp 0.5s ease 0.1s both; }
        .blog-item:nth-child(2) { animation: fadeInUp 0.5s ease 0.2s both; }
        .end-note { animation: fadeIn 0.5s ease 0.3s both; }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .page-title {
                font-size: 1.8rem;
            }
            
            .blog-item {
                flex-direction: column;
                padding: 20px;
                gap: 16px;
            }
            
            .blog-date-col {
                border-right: none;
                border-bottom: 2px solid var(--bg-tertiary);
                padding-right: 0;
                padding-bottom: 12px;
                min-width: auto;
                display: flex;
                align-items: center;
                gap: 12px;
            }
            
            .blog-date-day {
                font-size: 1.5rem;
            }
            
            .blog-title {
                font-size: 1.1rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="../" class="back-home"><i class="fas fa-arrow-left"></i> 返回主页</a>
        
        <header class="page-header">
            <div class="page-icon">
                <i class="fas fa-pen-fancy"></i>
            </div>
            <h1 class="page-title">学术日志</h1>
            <p class="page-subtitle">技术分享与学术研究笔记</p>
        </header>

        <!-- 博客列表 -->
        <div class="blog-list">
            <a href="./posts/radar-deep-learning.html" class="blog-item">
                <div class="blog-date-col">
                    <div class="blog-date-day">20</div>
                    <div class="blog-date-month">2025年1月</div>
                </div>
                <div class="blog-content">
                    <h3 class="blog-title">深度学习驱动的星载雷达反演：从理论到实现</h3>
                    <p class="blog-excerpt">探讨如何利用U-Net架构处理GPM-DPR双频数据，解决台风环境下垂直速度观测的缺失问题...</p>
                    <div class="blog-tags">
                        <span class="blog-tag research">研究</span>
                        <span class="blog-tag dl">深度学习</span>
                    </div>
                </div>
            </a>

            <a href="./posts/marathon-running.html" class="blog-item">
                <div class="blog-date-col">
                    <div class="blog-date-day">15</div>
                    <div class="blog-date-month">2024年12月</div>
                </div>
                <div class="blog-content">
                    <h3 class="blog-title">大气科学与马拉松：耐力的双重修行</h3>
                    <p class="blog-excerpt">在南大校园的1000公里跑量中，我发现科研与长跑在本质上有着惊人的相似性...</p>
                    <div class="blog-tags">
                        <span class="blog-tag life">生活</span>
                        <span class="blog-tag run">跑步</span>
                    </div>
                </div>
            </a>
        </div>
        
        <p class="end-note">— 更多文章持续更新中 —</p>
    </div>
</body>
</html>
