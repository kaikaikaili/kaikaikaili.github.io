<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOGS - Likai</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --neon-blue: #00f2ff; --bg-dark: #050a0f; --text-gray: #a0aec0; }
        body {
            background-color: var(--bg-dark); color: #fff; font-family: 'JetBrains Mono', monospace;
            background-image: linear-gradient(rgba(0,242,255,0.03) 1px, transparent 1px); background-size: 100% 30px;
        }
        .container { max-width: 850px; margin: 0 auto; padding: 60px 20px; }
        .terminal-header { border-bottom: 2px solid var(--neon-blue); padding-bottom: 10px; margin-bottom: 40px; }
        .log-item { 
            display: flex; margin-bottom: 30px; padding: 20px; border: 1px solid rgba(0,242,255,0.1);
            transition: 0.3s; text-decoration: none; color: inherit;
        }
        .log-item:hover { border-color: var(--neon-blue); background: rgba(0,242,255,0.05); transform: scale(1.01); }
        .log-date { min-width: 120px; color: var(--neon-blue); font-size: 0.9rem; border-right: 1px solid rgba(0,242,255,0.2); margin-right: 20px; }
        .log-content h3 { margin-bottom: 10px; font-size: 1.2rem; color: #fff; }
        .log-content p { font-size: 0.9rem; color: var(--text-gray); line-height: 1.6; }
        .tag { font-size: 0.7rem; background: rgba(0,242,255,0.1); color: var(--neon-blue); padding: 2px 8px; border-radius: 10px; margin-top: 10px; display: inline-block; }
    </style>
</head>
<body>
    <div class="container">
        <header class="terminal-header">
            <a href="../" style="color:var(--neon-blue); text-decoration:none; font-size:0.8rem;">[ BACK_TO_TERMINAL ]</a>
            <h1 style="margin-top:15px; letter-spacing:5px;">SYSTEM_LOGS</h1>
        </header>

        <!-- 博客文章列表项 -->
        <a href="./posts/radar-deep-learning.html" class="log-item">
            <div class="log-date">2025/01/20</div>
            <div class="log-content">
                <h3>深度学习驱动的星载雷达反演：从理论到实现</h3>
                <p>探讨如何利用U-Net架构处理GPM-DPR双频数据，解决台风环境下垂直速度观测的缺失问题...</p>
                <span class="tag">#RESEARCH</span> <span class="tag">#DEEP_LEARNING</span>
            </div>
        </a>

        <a href="./posts/marathon-running.html" class="log-item">
            <div class="log-date">2024/12/15</div>
            <div class="log-content">
                <h3>大气科学与马拉松：耐力的双重修行</h3>
                <p>在南大校园的1000公里跑量中，我发现科研与长跑在本质上有着惊人的相似性...</p>
                <span class="tag">#LIFE</span> <span class="tag">#RUNNING</span>
            </div>
        </a>
    </div>
</body>
</html>
